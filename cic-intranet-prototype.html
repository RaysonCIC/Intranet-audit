<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIC Intranet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: SharePoint hub site – red suite bar, white site header + hub nav, 1204px content column (118px gutters at 1440), cards on a soft photo ground. Tokens mirror the CIC Figma design system (Fluent 2 with CIC red). */
:root{
  --brand:#c8102e;--brand-hover:#a80f27;--brand-pressed:#8a0d21;--brand-tint:#fdf0f2;--brand-tint-hover:#f9d8dd;--brand-stroke2:#f5bec6;
  --brand-fg:#c8102e;--link:#a80f27;--link-hover:#8a0d21;--on-brand:#ffffff;--gold:#f5b800;
  --bg1:#ffffff;--bg1-hover:#f5f5f5;--bg2:#fafafa;--bg3:#f5f5f5;--bg4:#f0f0f0;
  --fg1:#242424;--fg2:#424242;--fg3:#616161;--fg4:#707070;--fg-disabled:#bdbdbd;
  --stroke1:#d1d1d1;--stroke2:#e0e0e0;--stroke3:#f0f0f0;--stroke-acc:#616161;
  --ok-bg:#f1faf1;--ok-fg:#0e700e;--warn-bg:#fff9f5;--warn-fg:#bc4b09;--danger-bg:#fdf3f4;--danger-fg:#b10e1c;
  --tag-blue:#0055cc;--tag-green:#216e4e;--tag-purple:#5e4db2;--tag-teal:#206a83;--tag-orange:#a54800;--tag-magenta:#943d73;--tag-grey:#44546f;--tag-yellow:#f8e6a0;--tag-yellow-fg:#533f04;
  --ground-veil:rgba(255,255,255,0);
  --sh2:0 0 2px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14);
  --sh4:0 0 2px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);
  --sh16:0 0 2px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.14);
  --sh28:0 0 8px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.14);
  --font:"Ubuntu","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;--r-sm:4px;--content:1204px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#a80f27;--brand-hover:#c8102e;--brand-pressed:#570915;--brand-tint:#2e050b;--brand-tint-hover:#570915;--brand-stroke2:#6e0b1a;
  --brand-fg:#e35a6e;--link:#e35a6e;--link-hover:#e87183;--on-brand:#fdf0f2;
  --bg1:#292929;--bg1-hover:#3d3d3d;--bg2:#1f1f1f;--bg3:#141414;--bg4:#0a0a0a;
  --fg1:#ffffff;--fg2:#d6d6d6;--fg3:#adadad;--fg4:#999999;--fg-disabled:#5c5c5c;
  --stroke1:#666666;--stroke2:#525252;--stroke3:#3d3d3d;--stroke-acc:#adadad;
  --ok-bg:#052505;--ok-fg:#54b054;--warn-bg:#4a1e04;--warn-fg:#f98845;--danger-bg:#3b0509;--danger-fg:#eeacb2;
  --ground-veil:rgba(20,20,20,.9);color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#a80f27;--brand-hover:#c8102e;--brand-pressed:#570915;--brand-tint:#2e050b;--brand-tint-hover:#570915;--brand-stroke2:#6e0b1a;
  --brand-fg:#e35a6e;--link:#e35a6e;--link-hover:#e87183;--on-brand:#fdf0f2;
  --bg1:#292929;--bg1-hover:#3d3d3d;--bg2:#1f1f1f;--bg3:#141414;--bg4:#0a0a0a;
  --fg1:#ffffff;--fg2:#d6d6d6;--fg3:#adadad;--fg4:#999999;--fg-disabled:#5c5c5c;
  --stroke1:#666666;--stroke2:#525252;--stroke3:#3d3d3d;--stroke-acc:#adadad;
  --ok-bg:#052505;--ok-fg:#54b054;--warn-bg:#4a1e04;--warn-fg:#f98845;--danger-bg:#3b0509;--danger-fg:#eeacb2;
  --ground-veil:rgba(20,20,20,.9);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--fg1);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fg1);outline-offset:2px;border-radius:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
svg.i16{width:16px;height:16px}
/* type */
.t-title1{font-size:32px;line-height:40px;font-weight:500}
.t-title2{font-size:28px;line-height:36px;font-weight:500}
.t-title3{font-size:24px;line-height:32px;font-weight:500}
.t-sub1{font-size:20px;line-height:26px;font-weight:500}
.t-sub2{font-size:16px;line-height:22px;font-weight:500}
.t-body2{font-size:16px;line-height:22px}
.t-strong{font-weight:500}
.t-cap{font-size:12px;line-height:16px}
.t-cap-s{font-size:12px;line-height:16px;font-weight:500}
.t-cap2{font-size:10px;line-height:14px;font-weight:500}
.fg2{color:var(--fg2)}.fg3{color:var(--fg3)}.brand{color:var(--brand-fg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}

/* ---------- suite bar ---------- */
.suite{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:48px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:12px;padding-right:16px}
.suite .waffle{width:48px;height:48px;display:grid;place-items:center;background:rgba(0,0,0,.12)}
.suite .appname{font-size:16px;font-weight:500;white-space:nowrap}
.suite .search{flex:1;max-width:540px;margin-inline:auto;height:32px;background:#fff;color:#616161;border-radius:4px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid transparent}
.suite .search input{border:0;outline:0;flex:1;min-width:0;font:inherit;color:#242424;background:transparent}
.suite .icons{display:flex;align-items:center;gap:4px}
.suite .ib{width:36px;height:36px;display:grid;place-items:center;border-radius:4px}
.suite .ib:hover{background:rgba(0,0,0,.14)}
.acct{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px}
.acct:hover{background:rgba(0,0,0,.14)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;flex:none;background:var(--brand);color:var(--on-brand)}
.av.neutral{background:var(--bg4);color:var(--fg2)}
.av.s24{width:24px;height:24px;font-size:10px}.av.s40{width:40px;height:40px;font-size:14px}.av.s48{width:48px;height:48px;font-size:16px}
.acct .av{background:#f0f0f0;color:#424242}
.acct .who{line-height:14px}.acct .who b{display:block;font-size:12px;font-weight:500}.acct .who span{font-size:11px;opacity:.9}

/* ---------- site header ---------- */
.site{background:var(--bg1);border-bottom:1px solid var(--stroke2)}
.wrap{max-width:calc(var(--content) + 32px);margin-inline:auto;padding-inline:16px}
.site .row{display:flex;align-items:center;gap:16px;padding-top:20px}
.logo{width:56px;height:auto}
.site .name{font-size:24px;line-height:32px;font-weight:500}
.site .tag{font-size:12px;color:var(--fg3)}
.site .acts{margin-left:auto;display:flex;gap:8px}
.btn-sub{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:4px;font-weight:500;color:var(--fg2)}
.btn-sub:hover{background:var(--bg1-hover);color:var(--fg1)}
.hubnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.hubnav::-webkit-scrollbar{display:none}
.navi{position:relative}
.navi>button,.navi>a{display:flex;align-items:center;gap:4px;height:44px;padding:0 10px;color:var(--fg2);white-space:nowrap;border-bottom:2px solid transparent}
.navi>button:hover,.navi>a:hover{color:var(--fg1);background:var(--bg1-hover)}
.navi.sel>button,.navi.sel>a{color:var(--fg1);font-weight:500;border-bottom-color:var(--brand)}
.menu{position:absolute;top:44px;left:0;z-index:50;min-width:220px;background:var(--bg1);border-radius:8px;box-shadow:var(--sh16);padding:4px;display:grid}
.menu a{padding:8px 12px;border-radius:4px;display:flex;align-items:center;gap:10px;min-height:36px}
.menu a svg{color:var(--fg3);flex:none}
.menu a.all{border-top:1px solid var(--stroke2);border-radius:0 0 4px 4px;margin-top:4px;color:var(--link);font-weight:500}
.menu a.all svg{color:var(--link)}
.menu a:hover{background:var(--bg1-hover)}
.menu a small{color:var(--fg3);font-size:12px}
.menu-pop{position:fixed;z-index:60}
.acctmenu{width:320px;max-width:calc(100vw - 16px);max-height:calc(100vh - 64px);overflow:auto;padding:0;gap:0}
.acctmenu .prof{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--stroke2)}
.acctmenu .prof .av{width:48px;height:48px;font-size:16px}
.acctmenu .prof b{display:block;font-size:16px;line-height:22px;font-weight:500}
.acctmenu .prof small{display:block;color:var(--fg3);font-size:12px;line-height:16px}
.acctmenu .grp{padding:4px;display:grid;gap:0}
.acctmenu .grp+.grp{border-top:1px solid var(--stroke2)}
.mlabel{padding:8px 12px 4px;font-size:12px;line-height:16px;font-weight:500;color:var(--fg3)}
.role,.mi{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;padding:8px 12px;border-radius:4px;color:var(--fg1)}
.mi{align-items:center}
.role:hover,.mi:hover{background:var(--bg1-hover)}
.role small{display:block;color:var(--fg3);font-size:12px;line-height:16px}
.role .rad{width:16px;height:16px;margin-top:2px;border-radius:50%;border:1px solid var(--stroke1);display:grid;place-items:center}
.role[aria-checked="true"]{background:var(--brand-tint)}
.role[aria-checked="true"] .t-strong{color:var(--brand-fg)}
.role[aria-checked="true"] .rad{border-color:var(--brand)}
.role[aria-checked="true"] .rad::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.mi svg{color:var(--fg3)}

.ground::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(var(--ground-veil),var(--ground-veil)),linear-gradient(180deg,transparent 75%,var(--bg2))}
.ground.plain::before,.ground.plain::after{display:none}
main{padding-block:24px 64px}
.page{max-width:calc(var(--content) + 32px);margin-inline:auto;padding-inline:16px;display:grid;gap:24px}

/* ---------- cards ---------- */
.card{background:var(--bg1);border-radius:var(--r);box-shadow:var(--sh4);padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.composer input{min-width:0;flex:1}
@media (max-width:480px){.card{padding:16px}}
.sh{display:flex;align-items:center;gap:12px}
.sh h2{font-size:20px;line-height:26px;font-weight:500;flex:1}
.sh .meta{color:var(--fg3)}
.lnk{color:var(--link);font-weight:500}
.lnk:hover{color:var(--link-hover);text-decoration:underline}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.cols>*{min-width:0}
.stack{display:grid;gap:24px;min-width:0}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:4px;font-weight:500;border:1px solid var(--stroke1);background:var(--bg1);color:var(--fg1);white-space:nowrap}
.btn:hover{background:var(--bg1-hover);border-color:var(--stroke1)}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.primary:disabled{background:var(--bg4);color:var(--fg-disabled);cursor:default}
.btn.subtle{border-color:transparent;background:transparent;color:var(--fg2)}
.btn.subtle:hover{background:var(--bg1-hover)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}

/* hero carousel */
.hero{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:1204/380;max-width:100%;min-height:240px;background:#2b1a14 center/cover;box-shadow:var(--sh4)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 60%),linear-gradient(0deg,rgba(0,0,0,.45),transparent 55%)}
.hero .cap{position:absolute;left:32px;right:200px;bottom:28px;z-index:1;color:#fff;display:grid;gap:10px;justify-items:start}
.hero .cap h2{font-size:28px;line-height:36px;font-weight:500}
.hero .cap p{max-width:60ch;opacity:.92}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:10px;font-weight:500;background:var(--brand-tint);color:var(--brand-fg)}
.badge.onimg{background:#fff;color:#c8102e}
.badge.solid{background:var(--brand);color:var(--on-brand)}
.hero .ctrl{position:absolute;right:28px;bottom:28px;z-index:1;display:flex;align-items:center;gap:12px}
.hero .ctrl button{width:32px;height:32px;border-radius:4px;background:#fff;color:#242424;display:grid;place-items:center;box-shadow:var(--sh4)}
.dots{display:flex;gap:6px}
.dots span{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.6);transition:width .2s}
.dots span.on{width:20px;background:#fff}
@media (max-width:700px){.hero .cap{right:24px;left:20px;bottom:64px}.hero .cap h2{font-size:20px;line-height:26px}.hero .ctrl{right:20px;bottom:20px}}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.stat{border-radius:4px;padding:12px;background:var(--bg1);border:1px solid var(--stroke2);display:grid;gap:4px}
.stat b{font-size:28px;line-height:36px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;line-height:16px;color:var(--fg2)}
.stat.brand b{color:var(--brand-fg)}
.stat.warn b{color:var(--warn-fg)}
.stat.ok b{color:var(--ok-fg)}
.nextup{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--stroke2);border-radius:var(--r)}
.icotile{width:32px;height:32px;border-radius:50%;background:var(--brand-tint);color:var(--brand-fg);display:grid;place-items:center;flex:none}

/* composer + posts */
.composer{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--stroke2);border-radius:var(--r)}
.field{flex:1;min-width:0;height:32px;border:1px solid var(--stroke1);border-bottom-color:var(--stroke-acc);border-radius:4px;padding:0 10px;font:inherit;color:var(--fg1);background:var(--bg1)}
.field:focus{outline:0;border-bottom:2px solid var(--brand)}
.post{border:1px solid var(--stroke2);border-radius:var(--r);padding:12px;display:grid;gap:12px}
.post .hd{display:flex;gap:10px;align-items:flex-start}
.post .by{flex:1;display:grid;gap:2px}
.post .by .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--fg3);font-size:12px}
.post .by .meta b{font-weight:500;color:var(--fg2)}
.praise{background:var(--brand-tint);border:1px solid var(--brand-stroke2);border-radius:var(--r);padding:12px;display:grid;gap:4px}
.reacts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--stroke2);font-size:12px;font-variant-numeric:tabular-nums;background:var(--bg1)}
.react[aria-pressed="true"]{background:var(--brand-tint);border-color:var(--brand-stroke2);color:var(--brand-fg)}
.spacer{flex:1}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px}
.qa a{display:grid;justify-items:center;gap:10px;text-align:center;color:var(--fg1);padding:4px;border-radius:8px}
.qa a:hover{background:var(--bg1-hover)}
.qa .circ{width:48px;height:48px;border-radius:50%;background:var(--brand);color:var(--gold);display:grid;place-items:center;box-shadow:var(--sh2)}

/* events */
.ev{display:flex;gap:12px;padding-block:10px;border-bottom:1px solid var(--stroke2);align-items:flex-start}
.ev:last-child{border-bottom:0}
.date{width:40px;flex:none;border:1px solid var(--stroke2);border-radius:4px;text-align:center;padding:4px 0;background:var(--bg1)}
.date small{display:block;font-size:11px;line-height:14px;color:var(--brand-fg)}
.date b{display:block;font-size:20px;line-height:24px;font-weight:400}
.ev .meta{display:grid;gap:2px;color:var(--fg3);font-size:12px}
.ev .meta span{display:flex;align-items:center;gap:6px}
.ev .tg{margin-left:auto}

/* joiners / people */
.person{display:flex;align-items:center;gap:12px}
.person .t{display:grid;gap:0;min-width:0}
.joined{color:var(--brand-fg);font-size:12px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--stroke2);overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs button{height:40px;padding:0 12px;color:var(--fg2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--fg1)}
.tabs button[aria-selected="true"]{color:var(--fg1);font-weight:500;border-bottom-color:var(--brand)}
.filterbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.filterbar .tabs{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;height:32px;width:280px;max-width:100%;border:1px solid var(--stroke1);border-bottom-color:var(--stroke-acc);border-radius:4px;padding:0 10px;background:var(--bg1);color:var(--fg3)}
.searchbox input{border:0;outline:0;flex:1;min-width:0;font:inherit;background:transparent;color:var(--fg1)}

/* page banner */
.banner{background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.22)),var(--brand);color:var(--on-brand)}
.banner .wrap{display:flex;align-items:center;gap:20px;padding-block:28px}
.banner .tile{width:52px;height:52px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.banner p{opacity:.9}

/* news */
.ncard{background:var(--bg1);border-radius:var(--r);border:1px solid var(--stroke2);box-shadow:var(--sh2);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .15s}
.ncard:hover{box-shadow:var(--sh16)}
.ncard .img{aspect-ratio:386/170;background:var(--bg4) center/cover;max-width:100%}
.ncard .img.ph{display:grid;place-items:center;color:var(--fg3);font-weight:500;letter-spacing:.12em}
.ncard .img.gold{background:var(--tag-yellow);color:var(--tag-yellow-fg)}
.ncard .bd{padding:16px;display:grid;gap:8px;flex:1;align-content:start}
.ncard .cat{font-size:12px;font-weight:500;color:var(--brand-fg)}
.ncard .ft{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--stroke2);color:var(--fg3);font-size:12px;margin-top:auto}
.ncard .ft b{font-weight:500;flex:1}
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.ngrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.ngrid{grid-template-columns:minmax(0,1fr)}}
.featured{display:grid;grid-template-columns:minmax(0,640fr) minmax(0,564fr)}
.featured .img{aspect-ratio:auto;min-height:320px}
.featured .bd{padding:32px;align-content:center;gap:12px}
.featured h3{font-size:28px;line-height:36px;font-weight:500}
@media (max-width:820px){.featured{grid-template-columns:minmax(0,1fr)}.featured .img{min-height:220px}.featured h3{font-size:22px;line-height:28px}}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--fg3);font-size:12px}
.pager .pg{display:flex;gap:4px;margin-left:auto}
.pager .pg button{min-width:32px;height:32px;border-radius:4px;color:var(--fg1);font-size:14px}
.pager .pg button:hover{background:var(--bg1-hover)}
.pager .pg button[aria-current="page"]{background:var(--brand);color:var(--on-brand);font-weight:500}

/* article */
.article{max-width:812px;margin-inline:auto;display:grid;gap:20px;padding-inline:16px}
.article .lead{font-size:16px;line-height:24px;color:var(--fg2)}
.article .body{display:grid;gap:16px;font-size:16px;line-height:26px}
.article .body h3{font-size:20px;line-height:26px;font-weight:500;margin-top:8px}
.abar{display:flex;align-items:center;gap:4px;border-block:1px solid var(--stroke2);padding-block:6px;flex-wrap:wrap}
.article .photo{border-radius:var(--r);aspect-ratio:812/420;background:center/cover;max-width:100%}

/* resources */
.coll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:980px){.coll{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.coll{grid-template-columns:minmax(0,1fr)}}
.ccard{background:var(--bg1);border:1px solid var(--stroke2);border-radius:var(--r);box-shadow:var(--sh2);padding:20px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.ccard:hover{box-shadow:var(--sh16)}
.ccard .ic{color:var(--brand-fg)}
.ccard .ft{display:flex;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--stroke2);color:var(--fg3);font-size:12px}
.ccard .ft svg{margin-left:auto;color:var(--brand-fg)}
.drow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.9fr) 32px;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--stroke2)}
.drow:last-child{border-bottom:0}
.drow .nm{display:flex;align-items:center;gap:10px;font-weight:500;min-width:0}
.drow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .nm svg{color:var(--brand-fg)}
@media (max-width:720px){.drow{grid-template-columns:minmax(0,1fr) 32px}.drow .hide-sm{display:none}}
.empty{padding:24px;text-align:center;color:var(--fg3)}

/* workspace */
.wsban{position:relative;color:#fff;background:#2b1a14 center/cover}
.wsban::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,10,10,.82),rgba(20,10,10,.55) 60%,rgba(20,10,10,.35))}
.wsban .wrap{position:relative;display:flex;align-items:center;gap:24px;padding-block:40px;flex-wrap:wrap}
.wsban .meta{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;margin-top:6px}
.wsban .meta span{display:flex;align-items:center;gap:6px}
.invite{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);font-weight:500;color:#fff}
.invite:hover{background:rgba(255,255,255,.28)}
.frow{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--stroke2)}
.frow:last-child{border-bottom:0}
.ftype{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:500;flex:none}
.ftype.PDF{background:var(--brand)}.ftype.DOC{background:var(--tag-blue)}.ftype.XLS{background:var(--tag-green)}.ftype.PPT{background:var(--tag-orange)}
.frow .t{flex:1;min-width:0}
.frow .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{width:28px;height:28px;display:grid;place-items:center;border-radius:4px;color:var(--fg3)}
.star:hover{background:var(--bg1-hover)}
.star[aria-pressed="true"]{color:var(--brand-fg)}
.star[aria-pressed="true"] svg{fill:currentColor}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.apps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.app{border:1px solid var(--stroke2);border-radius:var(--r);padding:14px;display:grid;gap:4px;text-align:left;background:var(--bg1);align-content:start}
.app:hover{background:var(--bg1-hover);border-color:var(--stroke1)}
.app svg{color:var(--brand-fg);margin-bottom:6px}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:3px;font-size:10px;font-weight:500;color:#fff;white-space:nowrap}
.tag.Blue{background:var(--tag-blue)}.tag.Green{background:var(--tag-green)}.tag.Purple{background:var(--tag-purple)}.tag.Teal{background:var(--tag-teal)}.tag.Orange{background:var(--tag-orange)}.tag.Magenta{background:var(--tag-magenta)}.tag.Grey{background:var(--tag-grey)}.tag.Yellow{background:var(--tag-yellow);color:var(--tag-yellow-fg)}
.dlist{display:grid;gap:16px}

/* dialog / toast / hub */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px}
.dialog{background:var(--bg1);border-radius:8px;box-shadow:var(--sh28);width:min(480px,100%);padding:24px;display:grid;gap:16px}
.toast{position:fixed;z-index:90;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg1);color:var(--fg1);border-left:4px solid var(--ok-fg);border-radius:8px;box-shadow:var(--sh16);padding:12px 16px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.ehub{position:fixed;z-index:30;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg1);border-radius:8px;box-shadow:var(--sh16);padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.ehub .icotile{width:40px;height:40px}

/* footer */
footer{background:var(--bg1);border-top:1px solid var(--stroke2);padding-block:24px}
footer .wrap{display:grid;gap:8px}
footer .r1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
footer .r1 img{width:36px}
footer nav{margin-left:auto;display:flex;gap:20px;flex-wrap:wrap;color:var(--fg2)}
footer nav a:hover{color:var(--link);text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){.suite{gap:6px;padding-right:6px}.suite .appname{display:none}.suite .search{min-width:0;margin-inline:0}.suite .ib{width:32px}}

/* conversations paging */
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feedfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--stroke2)}
.feedfoot>span{flex:1}

/* app shell (Asset Tracker, Design Desk, Travel Desk) */
.appwrap{display:grid;grid-template-columns:280px minmax(0,1fr);background:var(--bg3);min-height:70vh}
.snav{background:var(--bg1);border-right:1px solid var(--stroke2);padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.shead{display:flex;align-items:center;gap:12px;padding:0 4px 16px}
.stile{width:40px;height:40px;border-radius:6px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.shead b{display:block;font-size:20px;line-height:26px;font-weight:500}.shead small{font-size:12px;color:var(--fg3)}
.snav nav{display:grid;gap:2px}
.si{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:4px;color:var(--fg1);position:relative;text-align:left;width:100%}
.si svg{color:var(--fg2);flex:none}
.si:hover{background:var(--bg1-hover)}
.si[aria-current="page"]{background:var(--brand-tint);color:var(--brand-fg);font-weight:500}
.si[aria-current="page"] svg{color:var(--brand-fg)}
.si[aria-current="page"]::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--brand)}
.si .cnt{margin-left:auto;min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--brand);color:var(--on-brand);font-size:10px;font-weight:500;display:grid;place-items:center}
.slabel{padding:20px 12px 6px;font-size:12px;color:var(--fg3)}
.shelp{margin-top:24px;border:1px solid var(--brand-stroke2);background:var(--brand-tint);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.shelp b{font-size:16px;font-weight:500}.shelp p{color:var(--fg2)}
.acontent{padding:32px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-content:start;min-width:0;max-width:1180px}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--fg2)}
.crumb a:hover{text-decoration:underline}.crumb b{font-weight:500;color:var(--fg1)}
.crumb svg{color:var(--fg3)}
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead .tt{flex:1;min-width:260px;display:grid;gap:8px}
.phead h1{font-size:28px;line-height:36px;font-weight:500}
.phead p{color:var(--fg2);max-width:70ch}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.vas b{font-weight:500}.vas{font-weight:400}.vas svg{color:var(--fg3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpis .stat{background:var(--bg1);padding:16px;box-shadow:var(--sh2);border-color:transparent}
.kpis .stat b{font-size:28px;line-height:36px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alert{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r);background:var(--warn-bg);border:1px solid #f4d4bf;flex-wrap:wrap}
.alert .ico{width:36px;height:36px;border-radius:50%;background:var(--warn-fg);color:#fff;display:grid;place-items:center;flex:none}
.alert .tx{flex:1;min-width:220px;display:grid;gap:2px}
.alert small{color:var(--warn-fg);font-size:11px;font-weight:500}
.alert h3{font-size:16px;line-height:22px;font-weight:500}
.alert p{color:var(--fg2);font-size:12px}
.dtwrap{container:dt / inline-size;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.dtbar{display:flex;align-items:center;gap:8px;position:relative}
.dtbar .searchbox{flex:1 1 auto;width:auto;min-width:0;max-width:360px}
.dtbar .sp{flex:1}
.fbtn[aria-expanded="true"]{background:var(--bg1-hover)}
.fbtn .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-size:11px;display:grid;place-items:center}
.fpanel{position:absolute;top:40px;right:0;z-index:20;width:300px;max-width:100%;background:var(--bg1);border-radius:8px;box-shadow:var(--sh16);padding:16px;display:grid;gap:12px}
.fpanel label{display:grid;gap:4px;font-size:12px;color:var(--fg2)}
.fpanel select{height:32px;border:1px solid var(--stroke1);border-bottom-color:var(--stroke-acc);border-radius:4px;background:var(--bg1);color:var(--fg1);font:inherit;padding:0 8px}
.fpanel .ft{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px 0 10px;border-radius:12px;background:var(--brand-tint);color:var(--brand-fg);font-size:12px;font-weight:500}
.chip:hover{background:var(--brand-tint-hover)}
.tblw{min-width:0}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:400;color:var(--fg2);padding:8px;border-bottom:1px solid var(--stroke1);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--stroke2);vertical-align:middle}
.tbl tr:hover td{background:var(--bg1-hover)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nw{white-space:nowrap}
.tbl td b{font-weight:500}
.tbl td small{display:block;font-size:12px;color:var(--fg3);line-height:16px}
.tbl td small.mm,.tbl td small.mm2{display:none}
.tbl .od small{color:var(--danger-fg)}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.tbl td.empty{text-align:center;color:var(--fg3);padding:32px}
@container dt (max-width:960px){.tbl .p3{display:none}.tbl td small.mm{display:block}}
@container dt (max-width:720px){.tbl .p2{display:none}.tbl td small.mm2{display:block}}
@container dt (max-width:540px){
 .tbl thead{display:none}
 .tbl,.tbl tbody{display:block}
 .tbl tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 4px;border-bottom:1px solid var(--stroke2)}
 .tbl tr:hover td{background:none}
 .tbl td{border:0;padding:0}
 .tbl td:first-child{flex:1 1 100%}
 .tbl td.r:last-child{margin-left:auto}
 .tbl .acts{flex-wrap:wrap}
 .dtbar .searchbox{max-width:none}
}
.sb{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:500;background:var(--bg4);color:var(--fg1);white-space:nowrap}
.sb::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg3)}
.sb.gold::before{background:var(--gold)}
.sb.warn{background:var(--warn-bg);color:var(--warn-fg)}.sb.warn::before{background:var(--warn-fg)}
.sb.danger{background:var(--danger-bg);color:var(--danger-fg)}.sb.danger::before{background:var(--danger-fg)}
.sb.ok{background:var(--ok-bg);color:var(--ok-fg)}.sb.ok::before{background:var(--ok-fg)}
.pager .pg button:disabled{color:var(--fg-disabled);cursor:default;background:none}
@media (max-width:900px){
 .appwrap{grid-template-columns:minmax(0,1fr)}
 .snav{border-right:0;border-bottom:1px solid var(--stroke2);padding:12px 16px}
 .shead{padding-bottom:8px}
 .snav nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px}
 .si{width:auto;white-space:nowrap;flex:none}.si[aria-current="page"]::before{display:none}
 .snav .slabel,.snav .res,.shelp{display:none}
 .acontent{padding:20px 16px}
}

/* forms */
[hidden]{display:none!important}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.rail{display:grid;gap:16px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
@media (max-width:1100px){.fgrid{grid-template-columns:minmax(0,1fr)}.rail{position:static}}
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding:24px}
.form .fh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:4px}.form .fh h2{flex:1;font-size:20px;line-height:26px;font-weight:500}
.fsec{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:20px}
.fsec+.fsec{border-top:1px solid var(--stroke2)}
.fsec>h3{font-size:16px;line-height:22px;font-weight:500}
.fsec>h3+.sub{margin-top:-14px}
.sub,.hint{font-size:12px;line-height:16px;color:var(--fg3)}
.fld{display:grid;gap:6px;min-width:0}
.fld>.lbl{font-weight:500;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.fld>.lbl small{font-weight:400;font-size:12px;color:var(--fg3)}
.req{color:var(--brand-fg)}
.inp{height:32px;width:100%;min-width:0;border:1px solid var(--stroke1);border-bottom-color:var(--stroke-acc);border-radius:4px;padding:0 10px;background:var(--bg1);color:var(--fg1);font:inherit}
select.inp{padding-right:28px}
textarea.inp{height:auto;min-height:76px;padding:8px 10px 24px;resize:vertical;line-height:20px}
.inp:focus{outline:0;border-bottom:2px solid var(--brand)}
.ta{position:relative}.ta .cnt{position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--fg3);pointer-events:none}
.emsg{display:none;font-size:12px;color:var(--danger-fg)}
.fld.err .inp{border-color:var(--danger-fg)}
.fld.err .opt{border-color:var(--danger-fg)}
.fld.err .emsg{display:block}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.row2{grid-template-columns:minmax(0,1fr)}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border:1px solid var(--stroke1);border-radius:4px;background:var(--bg1);cursor:pointer;user-select:none}
.opt:hover{background:var(--bg1-hover)}
.opt input{appearance:none;-webkit-appearance:none;margin:0;width:16px;height:16px;border:1px solid var(--fg3);border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg1);cursor:pointer}
.opt input[type="checkbox"]{border-radius:3px}
.opt input:checked{border-color:var(--brand)}
.opt input[type="radio"]:checked::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.opt input[type="checkbox"]:checked{background:var(--brand)}
.opt input[type="checkbox"]:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-tint);font-weight:500}
.opt:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.cond{border-left:3px solid var(--brand);background:var(--bg3);border-radius:4px;padding:12px 16px;display:grid;gap:12px}
.ro{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 10px;background:var(--bg3);border:1px solid var(--stroke2);border-radius:4px;color:var(--fg2);flex-wrap:wrap}
.ro svg{color:var(--fg3)}
.drop{display:grid;justify-items:center;gap:4px;padding:24px 16px;border:1px dashed var(--stroke1);border-radius:4px;text-align:center;cursor:pointer;color:var(--fg2)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-tint)}
.drop>svg{color:var(--brand-fg)}
.drop small{font-size:12px;color:var(--fg3)}
.files{display:grid;gap:6px}.files:empty{display:none}
.file{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 0 10px;border:1px solid var(--stroke2);border-radius:4px}
.file>svg{color:var(--brand-fg)}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--fg3);font-size:12px;white-space:nowrap}
.factions{display:flex;gap:8px;align-items:center;padding-top:20px;border-top:1px solid var(--stroke2);flex-wrap:wrap}
.factions .sp{flex:1}
.rcard{padding:20px;gap:12px}
.rcard h2{font-size:20px;line-height:26px;font-weight:500}
.steps{display:grid}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step .dot{width:24px;height:24px;border-radius:50%;border:1px solid var(--stroke1);display:grid;place-items:center;font-size:11px;background:var(--bg1);position:relative;z-index:1;color:var(--fg2)}
.step:not(:last-child)::before{content:"";position:absolute;left:11.5px;top:24px;bottom:0;width:1px;background:var(--stroke1)}
.step.done .dot{background:var(--ok-fg);border-color:var(--ok-fg);color:#fff}
.step.cur .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.step b{display:block;font-weight:500}.step small{display:block;font-size:12px;color:var(--fg3)}
.tips{display:grid;gap:10px;padding-left:0;list-style:none}
.tips li{position:relative;padding-left:14px;color:var(--fg2)}
.tips li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.ln{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-block:8px;border-bottom:1px solid var(--stroke2)}
.ln b{font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.ln small{display:block;font-size:12px;color:var(--fg3)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:4px}
.total b{font-size:24px;line-height:32px;font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:4px;font-size:12px;line-height:16px;font-weight:500}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill svg{flex:none}
.eta small{font-size:12px;color:var(--fg3)}.eta b{display:block;font-size:24px;line-height:32px;font-weight:500}
.profile{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr));gap:12px 16px;padding:16px;background:var(--bg3);border-radius:4px;align-items:start}
.profile .av{width:40px;height:40px;grid-row:span 2}
.profile small{display:block;font-size:12px;color:var(--fg3)}.profile b{font-weight:500}
@media (max-width:640px){.profile{grid-template-columns:40px repeat(2,minmax(0,1fr))}.profile .av{grid-row:span 3}}
.leg{border:1px solid var(--stroke2);border-radius:4px;padding:12px 16px;display:grid;gap:12px}
.leg .lh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--fg3)}
.leginfo{display:flex;gap:8px;align-items:center;background:var(--bg3);padding:8px 10px;border-radius:4px;font-size:12px;flex-wrap:wrap;color:var(--fg2)}
.addlink{justify-self:start;color:var(--link);font-weight:500;display:inline-flex;gap:4px;align-items:center}
.addlink:disabled{color:var(--fg-disabled)}
.submitcard{padding:16px;gap:8px}
.submitcard .btn{width:100%}
.okcard{display:grid;justify-items:start;gap:16px;padding:32px}
.okcard .big{width:48px;height:48px;border-radius:50%;background:var(--ok-bg);color:var(--ok-fg);display:grid;place-items:center}
.okcard h2{font-size:24px;line-height:32px;font-weight:500}
.okcard .ref{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;background:var(--bg3);border-radius:4px;font-weight:500}
.okcard .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:700px){.suite .who,.suite .icons .hide-sm{display:none}.site .acts{display:none}.site .name{font-size:20px;line-height:26px}}
</style>
<style>[hidden]{display:none!important}body{margin:0}</style>

/* generic data table: optional tabs, search, filter popover, responsive columns, paging */
const DT={};
function dtState(id){return S.dt[id]||(S.dt[id]={tab:0,q:'',page:1,f:{},open:false});}
function dtRows(c){const st=dtState(c.id);const q=st.q.toLowerCase();return c.rows.filter(r=>(c.tabs?c.tabs[st.tab][1](r):true)&&(!q||c.search(r).toLowerCase().includes(q))&&Object.entries(st.f).every(([k,v])=>!v||r[k]===v));}
function dtH(c){DT[c.id]=c;const st=dtState(c.id);const rows=dtRows(c);const per=c.per||8;const pages=Math.max(1,Math.ceil(rows.length/per));if(st.page>pages)st.page=pages;const from=(st.page-1)*per;const slice=rows.slice(from,from+per);
 const tabs=c.tabs?`<div class="tabs" role="tablist">${c.tabs.map(([l,fn],i)=>`<button role="tab" aria-selected="${i===st.tab}" data-dt-tab="${c.id}:${i}">${l} (${c.rows.filter(fn).length})</button>`).join('')}</div>`:'';
 const F=c.filters||[];const active=F.filter(([l,k])=>st.f[k]);
 const fbtn=F.length?`<button class="btn fbtn" data-dt-fbtn="${c.id}" aria-expanded="${st.open}" aria-haspopup="true">${ic('filter','i i16')}Filters${active.length?`<span class="n">${active.length}</span>`:''}</button>`:'';
 const panel=st.open?`<div class="fpanel" data-fpanel="${c.id}" role="dialog" aria-label="Filters">${F.map(([l,k])=>{const opts=[...new Set(c.rows.map(r=>r[k]))].sort();return `<label>${l}<select data-dt-f="${c.id}:${k}"><option value="">All</option>${opts.map(o=>`<option ${st.f[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;}).join('')}<div class="ft"><button class="lnk" data-dt-clear="${c.id}:*">Clear all</button><button class="btn primary sm" data-dt-fbtn="${c.id}">Done</button></div></div>`:'';
 const chips=active.length?`<div class="chips">${active.map(([l,k])=>`<button class="chip" data-dt-clear="${c.id}:${k}" aria-label="Remove ${l} filter">${l}: ${esc(st.f[k])}${ic('x','i i16')}</button>`).join('')}</div>`:'';
 const pg=[];for(let i=1;i<=pages;i++)pg.push(`<button data-dt-page="${c.id}:${i}" ${i===st.page?'aria-current="page"':''}>${i}</button>`);
 const cls=col=>[col[1]||'',col[2]?'p'+col[2]:''].join(' ');
 return `${tabs}<div class="dtbar"><label class="searchbox">${ic('search','i i16')}<input data-dt-q="${c.id}" value="${esc(st.q)}" placeholder="${c.ph}" aria-label="${c.ph}"></label><span class="sp"></span>${fbtn}${panel}</div>${chips}
 <div class="tblw"><table class="tbl"><thead><tr>${c.cols.map(col=>`<th class="${cls(col)}">${col[0]}</th>`).join('')}</tr></thead><tbody>${slice.length?slice.map(r=>`<tr>${c.cell(r).map((h,i)=>`<td class="${cls(c.cols[i])}">${h}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty" colspan="${c.cols.length}">Nothing matches – try clearing a filter</td></tr>`}</tbody></table></div>
 ${pages>1||rows.length>5?`<div class="pager"><span>Showing ${rows.length?from+1:0}–${from+slice.length} of ${rows.length}</span><div class="pg"><button aria-label="Previous page" data-dt-page="${c.id}:${st.page-1}" ${st.page===1?'disabled':''}>${ic('left','i i16')}</button>${pg.join('')}<button aria-label="Next page" data-dt-page="${c.id}:${st.page+1}" ${st.page===pages?'disabled':''}>${ic('right','i i16')}</button></div></div>`:''}`;}
function dtRefresh(id,focusQ){const el=document.getElementById('dt-'+id);if(!el)return;el.innerHTML=dtH(DT[id]);if(focusQ){const i=el.querySelector('[data-dt-q]');i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
document.addEventListener('click',e=>{
 const fb=e.target.closest('[data-dt-fbtn]');if(fb){const id=fb.dataset.dtFbtn;const st=dtState(id);st.open=!st.open;dtRefresh(id);return;}
 const cl=e.target.closest('[data-dt-clear]');if(cl){const [id,k]=cl.dataset.dtClear.split(':');const st=dtState(id);if(k==='*')st.f={};else delete st.f[k];st.page=1;dtRefresh(id);return;}
 if(!e.target.closest('.fpanel'))for(const id in S.dt){if(S.dt[id].open){S.dt[id].open=false;dtRefresh(id);}}
 const t=e.target.closest('[data-dt-tab]');if(t){const [id,i]=t.dataset.dtTab.split(':');const st=dtState(id);st.tab=+i;st.page=1;dtRefresh(id);return;}
 const p=e.target.closest('[data-dt-page]');if(p&&!p.disabled){const [id,i]=p.dataset.dtPage.split(':');dtState(id).page=+i;dtRefresh(id);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')for(const id in S.dt)if(S.dt[id].open){S.dt[id].open=false;dtRefresh(id);}});
document.addEventListener('input',e=>{const q=e.target.closest('[data-dt-q]');if(q){const st=dtState(q.dataset.dtQ);st.q=q.value;st.page=1;dtRefresh(q.dataset.dtQ,true);}});
document.addEventListener('change',e=>{const f=e.target.closest('[data-dt-f]');if(f){const [id,k]=f.dataset.dtF.split(':');const st=dtState(id);st.f[k]=f.value;st.page=1;dtRefresh(id);}});

function travelCalc(form){const tt=TT[fv(form,'ttype')];const mode=fv(form,'mode');const veh=fv(form,'veh');const other=fv(form,'other');
 $('#fVeh').hidden=mode!=='Road';$('#fDrv').hidden=!(mode==='Road'&&veh==='Company car');$('#fWho').hidden=!other;$('#fAdv').hidden=!fv(form,'adv');
 const p=other?STAFF.find(s=>s[0]===fv(form,'who'))||STAFF[1]:STAFF[0];
 $('#tProf').innerHTML=`<span class="av">${initials(p[0])}</span><div><small>Name</small><b>${p[0]}</b></div><div><small>PF number</small><b>${p[1]}</b></div><div><small>Department</small><b>${p[2]}</b></div><div><small>Job group</small><b>${p[3]}</b></div><div><small>Subsidiary</small><b>${p[4]}</b></div><div><small>Status</small><span class="sb ok">Verified</span></div>`;
 let days=0,nights=0;const legs=[...form.querySelectorAll('[data-leg]')];
 legs.forEach((l,i)=>{const d=pD(l.querySelector(`[name="dep${i}"]`).value),r=pD(l.querySelector(`[name="ret${i}"]`).value);const to=l.querySelector(`[name="to${i}"]`).value;const info=l.querySelector('[data-info]');
  if(d&&r&&r>=d){const n=tt.tag==='Same-day'?0:Math.round((r-d)/864e5);days+=n+1;nights+=n;info.innerHTML=`<span class="tag ${tt.tag==='Domestic'?'Green':tt.tag==='Regional'?'Blue':tt.tag==='International'?'Purple':'Teal'}">${tt.tag} ${mode.toLowerCase()}</span>${to} · ${n+1} day${n?'s':''}${n?`, ${n} night${n>1?'s':''}`:''} · per-diem KES ${tt.rate.toLocaleString('en-US')} a day for job group ${p[3]}`;}
  else info.innerHTML=`<span class="fg3">Pick dates – the return can’t be before departure.</span>`;});
 const pdm=days*tt.rate,acc=nights*tt.acc;let tl,tn,tv;
 if(mode==='Air'){tl='Air ticket';tn='Economy return · '+legs.length+' sector'+(legs.length>1?'s':'');tv=tt.air*legs.length;}
 else if(mode==='Train'){tl='Train ticket';tn='SGR first class return';tv=6000*legs.length;}
 else if(veh==='Company car'){tl='Fuel and ground';tn='Company car · 970 km';tv=6000*legs.length;}
 else if(veh==='Personal car'){tl='Mileage';tn='970 km × KES 30';tv=29100*legs.length;}
 else {tl='Public transport';tn='Bus or matatu return';tv=4000*legs.length;}
 const total=pdm+acc+tv;
 $('#tCost').innerHTML=`<div class="sh"><h2>Cost summary</h2><span class="sub">Auto-calculated</span></div><div><div class="ln"><span>Per-diem<small>${days} day${days!==1?'s':''} × KES ${tt.rate.toLocaleString('en-US')}</small></span><b>${kes(pdm)}</b></div>${tt.acc?`<div class="ln"><span>Accommodation<small>${nights} night${nights!==1?'s':''} × KES ${tt.acc.toLocaleString('en-US')}</small></span><b>${kes(acc)}</b></div>`:''}<div class="ln"><span>${tl}<small>${tn}</small></span><b>${kes(tv)}</b></div></div>
  <div class="total"><span class="t-strong">Estimated total</span><b>${kes(total)}</b></div><p class="sub">Rates from the Staff Travel Guidelines for job group ${p[3]}, ${tt.tag.toLowerCase()} travel. ${fv(form,'adv')?'Cash advance requested.':'No cash advance requested.'}</p>`;
 const route=[['Faith Sang','Head of department – Claims'],['HR business partner','Checks policy and leave'],['Finance manager','Approves the budget and any advance']];
 if(tt.tag==='International')route.push(['Group CEO','Signs off travel outside Africa']);if(tt.tag==='Regional')route.splice(2,0,['Group Travel Office','Checks visas and bookings']);
 $('#tRoute').innerHTML=`<div class="sh"><h2>Approval route</h2><span class="sub">${route.length} approvers</span></div>${stepsH(route)}<p class="sub">${tt.tag} · ${mode.toLowerCase()} trips follow this route.</p>`;
 const ready=fv(form,'decl');$('#tReady').innerHTML=ready?`<span style="color:var(--ok-fg)">${ic('check','i i16')}</span>Ready to submit – Faith Sang will be notified.`:`${ic('lock','i i16')}Tick the declaration to submit.`;
 form.querySelectorAll('[type=submit]').forEach(b=>b.disabled=!ready);document.querySelectorAll('[form="fTravel"]').forEach(b=>b.disabled=!ready);
 $('#addLeg').disabled=legs.length>=5;$('#addLeg span').textContent=`Add destination (${legs.length} of 5)`;
 return {total,to:form.querySelector('[name="to0"]').value,tt,mode,p,legs,route};}

  f.addEventListener('change',e=>{if(e.target.name==='rtype'){const t=e.target.value;const c=$('#aCond');const h=assetCond(t);c.innerHTML=h;c.hidden=!h;$('#aRoute').innerHTML=stepsH(ASSET_ROUTE[t]);const a=f.elements.asset;if(t==='Transfer from another user'&&a.value==='Replacement laptop')a.value='';}});

   MYREQ.unshift({id,t:fv(f,'asset'),cls:fv(f,'cls'),br:'Head Office',d:fmtD(TODAY,false),st:'Pending',note:type==='Transfer from another user'?'With '+fv(f,'custodian')+' (current custodian)':'With Peter Otieno (line manager)'});S.dt.amyreq&&(S.dt.amyreq.page=1);
   S.done.asset={id,name:fv(f,'asset'),type,cust:fv(f,'custodian')};render();toast('Request '+id+' submitted');};}
 if(k==='design'){const f=$('#fDesign');if(!f)return;designCalc(f);
  f.addEventListener('change',()=>designCalc(f));f.addEventListener('input',e=>{if(e.target.name==='needed')designCalc(f);});
  f.onsubmit=e=>{e.preventDefault();if(!validate(f))return;const {cats,eta}=designCalc(f);const id='DR-2026-0'+(143+DREQ.length-16);const need=pD(fv(f,'needed'));const wd=wdBetween(TODAY,need);
   DREQ.unshift({id,t:fv(f,'title'),ch:cats.join(', '),sub:fv(f,'sub'),reg:fv(f,'region'),who:'Amara Mwangi',dept:'Claims',des:'Unassigned',dl:fmtD(need,false),due:`In ${wd} days`,st:'Submitted'});
   S.done.design={id,name:fv(f,'title'),eta:fmtD(eta)};render();toast('Brief '+id+' submitted');};}

  const reLegs=()=>{const tt=TT[fv(f,'ttype')];f.querySelectorAll('[data-leg]').forEach((l,i)=>{const s=l.querySelector(`[name="to${i}"]`);const cur=s.value;s.innerHTML=tt.dest.map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('');});};

   if(e.target.name==='mode'&&e.target.value==='Air'&&fv(f,'ttype').startsWith('Domestic'))toast('Air travel needs HOD approval','Road is preferred for trips under 500 km');travelCalc(f);});
  f.addEventListener('input',e=>{if(/^(dep|ret)\d/.test(e.target.name))travelCalc(f);});
  $('#addLeg').onclick=()=>{const legs=f.querySelectorAll('[data-leg]');if(legs.length>=5)return;const i=legs.length;const prev=pD(f.querySelector(`[name="ret${i-1}"]`).value)||TODAY;const nx=new Date(prev);nx.setDate(nx.getDate()+2);const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
   const tt=TT[fv(f,'ttype')];$('#legs').insertAdjacentHTML('beforeend',legH(i,{from:f.querySelector(`[name="to${i-1}"]`).value,dests:tt.dest,to:tt.dest[1]||tt.dest[0],dep:iso(prev),ret:iso(nx)}));travelCalc(f);};
  f.addEventListener('click',e=>{const r=e.target.closest('[data-rmleg]');if(!r)return;r.closest('[data-leg]').remove();
   f.querySelectorAll('[data-leg]').forEach((l,i)=>{l.querySelector('.lh span').textContent='Leg '+(i+1);['from','to','dep','ret'].forEach(n=>{const x=l.querySelector(`[name^="${n}"]`);x.name=n+i;});});travelCalc(f);});
  f.onsubmit=e=>{e.preventDefault();if(!validate(f))return;const c=travelCalc(f);const id='TRV-'+(1044+TREQ.length-2);const d0=pD(f.querySelector('[name="dep0"]').value),r0=pD(f.querySelector('[name="ret0"]').value);const n=Math.round((r0-d0)/864e5);
   TREQ.unshift({id,to:c.to,note:'submitted today',mode:c.tt.tag+' '+c.mode.toLowerCase(),col:c.mode==='Air'?'Blue':'Teal',dates:`${d0.getDate()} → ${fmtD(r0,false)}`,len:`${n+1} days`,amt:Math.round(c.total).toLocaleString('en-US'),st:'Pending',ret:'Not due yet',retn:'After you travel'});
   S.done.travel={id,name:c.to+(c.legs.length>1?` + ${c.legs.length-1} more`:''),total:c.total,route:c.route};render();toast('Travel request '+id+' submitted');};}
}

 <hr style="border:0;border-top:1px solid var(--stroke2);width:100%;margin:0">
 <p class="fg2">${S.liked?'You, Brian Otieno and 23 others like this':'Brian Otieno and 23 others like this'}</p>
 <section id="comments" style="display:grid;gap:16px"><h2 class="t-sub1">Comments (${S.comments.length+4})</h2>
  <form class="composer" id="cForm"><span class="av">AM</span><label class="sr" for="cText">Add a comment</label><input class="field" id="cText" placeholder="Add a comment" autocomplete="off"><button class="btn primary" id="cBtn" disabled>Post</button></form>
  <div class="dlist" id="cList">${S.comments.map(([n,c,m])=>`<div class="person" style="align-items:flex-start"><span class="av">${initials(n)}</span><div class="t"><span class="t-strong">${esc(n)}</span><span>${esc(c)}</span><span class="t-cap fg3">${esc(m)}</span></div></div>`).join('')}</div>
  <a class="lnk" href="#comments" data-toast="All comments are shown in the live site">View all ${S.comments.length+4} comments</a></section>
</div>
<section style="background:var(--bg2);border-top:1px solid var(--stroke2);margin-top:40px;padding-block:40px 16px"><div class="page">${sh('More news','<a class="lnk" href="#news">See all</a>')}<div class="ngrid">${NEWS.slice(1,4).map(ncard).join('')}</div></div></section></main>`;};
function bindArticle(){$('#likeBtn').onclick=()=>{S.liked=!S.liked;render(false);};const i=$('#cText'),b=$('#cBtn');i.oninput=()=>b.disabled=!i.value.trim();$('#cForm').onsubmit=e=>{e.preventDefault();if(!i.value.trim())return;S.comments.unshift(['Amara Njeri',i.value.trim(),'Claims · just now']);render(false);toast('Comment posted');};}
V.resources=()=>{const q=S.resQ.toLowerCase();const rows=RES.filter(r=>(S.resTab==='All resources'||r[1]===S.resTab)&&(!q||r.join(' ').toLowerCase().includes(q)));const C=[['People & Culture templates','HR forms, policies, onboarding packs and staff templates.','people'],['IT guides','Access, security and device support guides.','shield'],['Finance forms','Claims, cash requests and procurement forms.','doc'],['Brand assets','Logos, templates and brand guidelines.','image']];
 return `${banner('Resource Centre','The group’s shared home for policies, guides, forms and brand resources.','doc')}<main class="ground plain"><div class="page">
 <div class="filterbar">${tabsH('resTabs',['All resources',...C.map(c=>c[0])],S.resTab)}<label class="searchbox">${ic('globe','i i16')}<span class="sr">Search resources</span><input id="resQ" placeholder="Search resources" value="${esc(S.resQ)}"></label></div>
 <section style="display:grid;gap:16px">${sh('Browse resources')}<div class="coll">${C.map(([t,d,i])=>`<button class="ccard" data-coll="${esc(t)}"><span class="ic">${ic(i)}</span><span class="t-sub2">${t}</span><span class="fg2">${d}</span><span class="ft">${RES.filter(r=>r[1]===t).length} resources${ic('right','i i16')}</span></button>`).join('')}</div></section>
 <section class="card">${sh(S.resTab==='All resources'&&!q?'Recently added':`${esc(S.resTab)}${q?` · “${esc(S.resQ)}”`:''}`,`<span class="meta">${rows.length} files</span>`)}
  <div><div class="drow t-cap-s fg3" style="padding-block:6px"><span>Name</span><span class="hide-sm">Collection</span><span class="hide-sm">Updated</span><span class="hide-sm">Type</span><span></span></div>${rows.map(r=>`<div class="drow"><span class="nm">${ic('doc','i i16')}<span>${esc(r[0])}</span></span><span class="hide-sm fg2">${r[1]}</span><span class="hide-sm fg2">${r[2]}</span><span class="hide-sm fg2">${r[3]}</span><button class="btn subtle sm" aria-label="More actions for ${esc(r[0])}" data-toast="Downloading ${esc(r[0])}">${ic('more','i i16')}</button></div>`).join('')||'<div class="empty">Nothing matches that search. Try a different word or pick another collection.</div>'}</div></section>
</div></main>`;};
function bindRes(){$('#resTabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){S.resTab=b.dataset.tab;render(false);}};$$('[data-coll]').forEach(b=>b.onclick=()=>{S.resTab=b.dataset.coll;render(false);});const q=$('#resQ');q.oninput=()=>{S.resQ=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{render(false);const n=$('#resQ');n.focus();n.setSelectionRange(n.value.length,n.value.length);},250);};}
V.events=()=>`${banner('Events','What’s on across CIC – town halls, training, wellbeing and team days.','cal')}<main class="ground plain"><div class="page"><div class="cols"><section class="card">${sh('Upcoming events',`<span class="meta">${EVENTS.length} events</span>`)}<div>${EVENTS.map(e=>evRow(...e)).join('')}</div></section><section class="card">${sh('Add to your calendar')}<p class="fg2">Every event syncs to Outlook when you RSVP. Team events also appear in each department workspace.</p><div class="dlist">${Object.entries(WS).map(([k,w])=>`<a class="person" href="#ws-${k}"><span class="icotile">${ic('people','i i16')}</span><div class="t"><span class="t-strong">${w.name}</span><span class="t-cap fg3">${w.events.length} upcoming</span></div></a>`).join('')}</div></section></div></div></main>`;
V.departments=()=>`${banner('Departments','Team workspaces for files, tools, people and what’s coming up.','people')}<main class="ground plain"><div class="page"><div class="coll">${Object.entries(WS).map(([k,w])=>`<a class="ccard" href="#ws-${k}"><span class="ic">${ic(w.privacy.startsWith('Private')?'lock':'globe')}</span><span class="t-sub2">${w.name}</span><span class="fg2">${w.tag}</span><span class="ft">${w.members} members · ${w.privacy.toLowerCase()}${ic('right','i i16')}</span></a>`).join('')}</div></div></main>`;
V.selfservice=()=>`${banner('Self-service','Request, approve and track things without the paperwork.','grid')}<main class="ground plain"><div class="page"><div class="coll">${[['Asset Tracker','Register, request, transfer and track company assets.','box','Approvals waiting: 3','asset'],['Design Desk','Submit creative briefs and follow them to delivery.','edit','2 in your queue','design'],['Travel Desk','Request trips, advances and file expense returns.','plane','1 return to file','travel'],['My payslip','Download payslips and P9 forms.','doc','Updated 25 Sep','']].map(([t,d,i,m,h])=>`<a class="ccard" ${h?`href="#${h}"`:`href="#selfservice" data-toast="Payslips open in the HR self-service portal"`}><span class="ic">${ic(i)}</span><span class="t-sub2">${t}</span><span class="fg2">${d}</span><span class="ft">${m}${ic('right','i i16')}</span></a>`).join('')}</div></div></main>`;
const wsView=k=>{const w=WS[k];const tab=S.wsTab[k]||'All files';const map={'Documents':'DOC','Spreadsheets':'XLS','Slides':'PPT','PDFs':'PDF'};const files=w.files.filter(f=>tab==='All files'||f[1]===map[tab]);
 return `<section class="wsban" ${imgStyle(w.img)}><div class="wrap"><div style="min-width:0"><h1 class="t-title1">${w.name}</h1><p>${w.tag}</p><div class="meta"><span>${ic(w.privacy.startsWith('Private')?'lock':'globe','i i16')}${w.privacy}</span><span>${ic('people','i i16')}${w.members} members</span><span>${ic('folder','i i16')}6 shared files</span><span>${ic('cal','i i16')}${w.events.length} upcoming</span></div></div><button class="invite" data-invite>${ic('personAdd','i i16')}Invite</button></div></section>
 <main class="ground plain"><div class="page"><div class="cols"><div class="stack">
  <section class="card">${sh('Shared documents','<a class="lnk" href="#resources">Open library</a>')}${tabsH('fTabs',['All files','Documents','Spreadsheets','Slides','PDFs'],tab)}<div>${files.map(f=>{const key=k+f[0];return `<div class="frow"><span class="ftype ${f[1]}">${f[1]}</span><div class="t"><b>${esc(f[0])}</b><span class="t-cap fg3">${f[1]} · ${f[2]}</span></div><span class="av s24 neutral">${f[3]}</span><span class="t-cap fg3" style="min-width:64px;text-align:right">${f[4]}</span><button class="star" aria-pressed="${!!S.stars[key]}" aria-label="Follow ${esc(f[0])}" data-star="${esc(key)}">${ic('star','i i16')}</button></div>`;}).join('')||'<div class="empty">No files of this type yet.</div>'}</div></section>
  <section class="card">${sh('Custom tools','<span class="meta">6 apps</span>')}<div class="apps">${w.tools.map(([t,d,i])=>`<button class="app" data-toast="${esc(t)} opens next in the prototype">${ic(i)}<span class="t-strong">${t}</span><span class="t-cap fg3">${d}</span></button>`).join('')}</div></section>
 </div><div class="stack">
  <section class="card" style="gap:12px">${sh('Team members',`<span class="meta">${w.members}</span>`)}<div class="dlist">${w.people.map(([n,r])=>`<div class="person"><span class="av s40">${initials(n)}</span><div class="t"><span class="t-strong">${n}</span><span class="t-cap fg3">${r}</span></div></div>`).join('')}</div><div style="display:flex;align-items:center;padding-top:12px;border-top:1px solid var(--stroke2)"><span class="t-cap fg3" style="flex:1">${w.members-w.people.length} more members</span><button class="lnk" data-invite>+ Invite</button></div></section>
  <section class="card">${sh('Upcoming events','<a class="lnk" href="#events">Calendar</a>')}<div>${w.events.map(e=>evRow('Aug',e[0],e[1],e[2],e[3],e[4],e[5])).join('')}</div></section>
  <section class="card" style="gap:12px">${sh('About this team')}<p class="fg2">${w.about}</p><span class="t-cap fg3">Team lead</span><div class="person"><span class="av s40">${initials(w.lead[0])}</span><div class="t"><span class="t-strong">${w.lead[0]}</span><span class="t-cap fg3">${w.lead[1]}</span></div></div></section>
 </div></div></div></main>`;};
function bindWs(k){$('#fTabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){S.wsTab[k]=b.dataset.tab;render(false);}};$$('[data-star]').forEach(b=>b.onclick=()=>{S.stars[b.dataset.star]=!S.stars[b.dataset.star];b.setAttribute('aria-pressed',!!S.stars[b.dataset.star]);});
 $$('[data-invite]').forEach(b=>b.onclick=()=>inviteDialog(WS[k].name));}
function inviteDialog(team){const l=$('#layer');l.innerHTML=`<div class="scrim" id="scrim"><form class="dialog" id="invForm" role="dialog" aria-modal="true" aria-labelledby="invT"><div style="display:flex;align-items:center"><h2 class="t-sub1" id="invT" style="flex:1">Invite to ${esc(team)}</h2><button type="button" class="btn subtle sm" id="invX" aria-label="Close">${ic('x','i i16')}</button></div><label class="t-strong" for="invWho">Colleague’s name or email</label><input class="field" id="invWho" placeholder="e.g. Grace Achieng" autocomplete="off"><p class="t-cap fg3">They’ll get a Teams notification and can open the workspace straight away.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="invC">Cancel</button><button class="btn primary">Send invite</button></div></form></div>`;
 const close=()=>l.innerHTML='';$('#invX').onclick=close;$('#invC').onclick=close;$('#scrim').onclick=e=>{if(e.target.id==='scrim')close();};$('#invWho').focus();
 $('#invForm').onsubmit=e=>{e.preventDefault();const v=$('#invWho').value.trim();if(!v){$('#invWho').focus();return;}close();toast('Invite sent to '+v,'Prototype – no message was actually sent');};}

/* ---------- router ---------- */
function render(scroll=true){const r=(location.hash||'#home').slice(1);if(r!==S.lastRoute&&r.endsWith('-new'))S.done[r.split('-')[0]]=null;S.lastRoute=r;const route=V[r]?r:(r.startsWith('ws-')&&WS[r.slice(3)]?r:'home');renderNav(route);
 $('#view').innerHTML=route.startsWith('ws-')?wsView(route.slice(3)):V[route]();
 if(route==='home')bindHome();if(route==='news')bindNews();if(route==='article')bindArticle();if(route==='resources')bindRes();if(route.startsWith('ws-'))bindWs(route.slice(3));if(APPS[route])bindApp(route);if(route.endsWith('-new')&&APPS[route.split('-')[0]])bindForm(route.split('-')[0]);
 document.title=({home:'CIC Intranet',news:'Company news',article:'News article',resources:'Resource Centre',events:'Events',departments:'Departments',selfservice:'Self-service',asset:'Asset Tracker',design:'Design Desk',travel:'Travel Desk','asset-new':'Request an asset','design-new':'New design request','travel-new':'New travel request'}[route]||WS[route.slice(3)].name)+' · CIC Intranet';
 if(scroll)scrollTo(0,0);}
addEventListener('hashchange',()=>render());
document.addEventListener('click',e=>{const t=e.target.closest('[data-toast]');if(t){e.preventDefault();toast(t.dataset.toast);}});
document.addEventListener('click',e=>{if(e.target.closest('.acctmenu .mi[data-toast]')){const m=$('.menu-pop');if(m)setTimeout(()=>m.remove());$('#acctBtn').setAttribute('aria-expanded','false');}});
syncAcct();render();
</script>

</body>
</html>
